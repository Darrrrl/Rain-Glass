[package]
name = "rainglass-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rainglass-core = { path = "../rainglass-core" }
wgpu = "24"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tray-icon = "0.24"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "mp4"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
